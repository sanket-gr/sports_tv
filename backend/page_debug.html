<!DOCTYPE html><html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security check</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
    }
    .card {
      text-align: center;
      padding: 2rem 2.5rem;
      max-width: 24rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 1.25rem;
      border: 3px solid #38444d;
      border-top-color: #1d9bf0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { margin: 0; font-size: 0.875rem; color: #8b98a5; }
    .err { color: #f4212e; margin-top: 1rem; display: none; }
    #turnstile-wrap { margin-top: 1rem; min-height: 65px; }
    #slider-wrap { margin-top: 1rem; min-height: 200px; display: none; }
    .card.wide { max-width: 22rem; }
     
    #slider-wrap .slider-captcha-stage { width: 320px; margin: 0 auto; }
    #slider-wrap .slider-captcha-stage > img {
      position: absolute;
      top: 0;
      left: 0;
    }
    #slider-wrap .slider-captcha-stage > img:first-of-type {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      z-index: 1;
    }
    #slider-wrap .slider-captcha-stage > img:last-of-type {
      top: 57px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
  </style>
  <style>/* Default styles for slider-captcha-js */
.slider-captcha-stage {
  position: relative;
  border: 1px solid #ccc;
  border-radius: 8px;
  overflow: hidden;
}

.slider-captcha-stage canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* Theme: Light */
.slider-captcha-light .slider-captcha-bar {
  background: #f0f0f0;
  border: 1px solid #ccc;
  color: #333;
}
.slider-captcha-light .slider-captcha-thumb {
  background: #fff;
  border: 1px solid #ccc;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}
.slider-captcha-light .slider-captcha-status {
  background: #fafafa;
  border: 1px solid #ddd;
  color: #333;
}
.slider-captcha-light .slider-captcha-status.ok {
  color: #16a34a;
}
.slider-captcha-light .slider-captcha-status.err {
  color: #dc2626;
}

/* Theme: Dark */
.slider-captcha-dark .slider-captcha-bar {
  background: #0b1220;
  border: 1px solid rgba(255,255,255,.08);
  color: #e5e7eb;
}
.slider-captcha-dark .slider-captcha-thumb {
  background: #0f172a;
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
.slider-captcha-dark .slider-captcha-status {
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.1);
  color: #e5e7eb;
}
.slider-captcha-dark .slider-captcha-status.ok {
  color: #16a34a;
}
.slider-captcha-dark .slider-captcha-status.err {
  color: #dc2626;
}

.slider-captcha-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  width: var(--w, 320px);
  height: 44px;
  background: #0b1220;
  border-radius: 999px;
  margin-top: 12px;
  border: 1px solid rgba(255,255,255,.08);
  font-size: 14px;
  color: #e5e7eb;
}

.slider-captcha-track {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  overflow: hidden;
}

.slider-captcha-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: linear-gradient(90deg,rgba(37,99,235,.25),rgba(37,99,235,.35));
}

.slider-captcha-thumb {
  position: relative;
  z-index: 2;
  margin-left: 6px;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  background: #0f172a;
  border: 1px solid rgba(255,255,255,.15);
  display: grid;
  place-items: center;
  cursor: grab;
  user-select: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
.slider-captcha-thumb:active {
  cursor: grabbing;
}
.slider-captcha-thumb svg {
  width: 18px;
  height: 18px;
  opacity: .9;
}

.slider-captcha-status {
  flex-shrink: 0;
  margin-left: auto;
  margin-right: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 13px;
  line-height: 1.4;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.03);
}
.slider-captcha-status.ok {
  color: #16a34a;
  border-color: rgba(22,163,74,.4);
}
.slider-captcha-status.err {
  color: #dc2626;
  border-color: rgba(220,38,38,.4);
}
.slider-captcha-status.shake {
  animation: shake .35s linear;
}
@keyframes shake {
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-4px)}
  100%{transform:translateX(0)}
}

.slider-captcha-refresh {
  cursor: pointer;
  margin-left: auto;
}

/* Loading overlay and spinner */
.slider-captcha-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.6);
  z-index: 15;
}

.slider-captcha-loading .spinner {
  width: 28px;
  height: 28px;
  border: 3px solid #999;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
